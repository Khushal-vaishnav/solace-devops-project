apiVersion: v1
kind: Service
metadata:
  name: solacedr
  namespace: solace
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: solacedr
  ports:
    - name: web
      port: 8080
      targetPort: 8080
    - name: smf
      port: 55555
      targetPort: 55555
